<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glowing Turmeric Water Trend</title>
  <style>
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    /* Loader overlay styles */
    #loader-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(17,17,17,0.98);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s;
    }
    #loader-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader {
      border: 6px solid #ffd70033;
      border-top: 6px solid #ffd700;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .container {
      position: relative;
      width: 200px;
      height: 300px;
      margin-bottom: 30px;
    }
    .glass {
      width: 100%;
      height: 100%;
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(4px);
      position: relative;
      overflow: hidden;
    }
    .turmeric {
      position: absolute;
      width: 100%;
      height: 0%;
      background: linear-gradient(to top, #ffd700, #f7c600);
      bottom: 0;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 0 20px 5px #f7c600a0;
      transition: height 3s ease;
      animation: swirl 4s infinite linear;
      background-size: 200% 200%;
    }
    @keyframes swirl {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .pouring {
      position: absolute;
      top: -50px;
      left: 50%;
      width: 10px;
      height: 50px;
      background: #f7c600;
      transform: translateX(-50%);
      opacity: 0;
      animation: pour 3s forwards;
    }
    @keyframes pour {
      0% { opacity: 0; height: 0; }
      20% { opacity: 1; height: 50px; }
      100% { opacity: 0; height: 50px; }
    }
    .glow {
      box-shadow: 0 0 40px 15px #ffd700cc;
    }
    .btn {
      padding: 10px 20px;
      background: #ffd700;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #f7c600;
    }
  </style>
</head>
<body>
  <div id="loader-overlay"><div class="loader"></div></div>
  <div class="container">
    <div class="glass">
      <div class="turmeric" id="turmeric"></div>
    </div>
    <div class="pouring" id="pouring"></div>
  </div>
  <button class="btn" id="toggleLight">Toggle Glow</button>
  <script>
    const turmeric = document.getElementById('turmeric');
    const pouring = document.getElementById('pouring');
    const toggleBtn = document.getElementById('toggleLight');
    const loader = document.getElementById('loader-overlay');
    let loaderHidden = false;
    function hideLoader() {
      if (!loaderHidden) {
        loaderHidden = true;
        loader.classList.add('hidden');
        setTimeout(() => loader.style.display = 'none', 600);
      }
    }
    // Hide loader after max 3s (fallback)
    setTimeout(hideLoader, 3000);
    // Hide loader after animation is done
    setTimeout(() => {
      turmeric.style.height = '70%';
      pouring.style.animationPlayState = 'running';
      setTimeout(() => {
        turmeric.classList.add('glow');
        hideLoader();
      }, 3000);
    }, 1000);
    toggleBtn.addEventListener('click', () => {
      turmeric.classList.toggle('glow');
    });
  </script>
</body>
</html>
